<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Block: Product Card</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f0f2f5; font-family: 'Trebuchet MS', Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f0f2f5;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Label -->
        <p style="font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #617084; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 12px 0;">Content Block: Product Card</p>

        <!-- 600px container -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff;">

          <!-- ===================== -->
          <!-- PRODUCT CARD BLOCK    -->
          <!-- ===================== -->
          <tr>
            <td style="background-color: #ffffff; padding: 24px;">
              <!-- Card with surface bg + border -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f7fafc; border: 1px solid rgba(17,40,79,0.12); border-radius: 8px;">
                <tr>
                  <td style="padding: 20px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <!-- Left: product image -->
                        <td width="160" valign="top" style="padding-right: 20px;">
                          <img src="file:///Users/blakebrooks/Documents/repos/MCA/enablement-course/static/course-assets/visionaire-ultralux.jpg" alt="Visionaire UltraLux frames" width="160" style="display: block; width: 160px; height: 160px; object-fit: cover; border-radius: 4px;" />
                        </td>

                        <!-- Right: text + button -->
                        <td valign="top">
                          <!-- Eyebrow -->
                          <p style="margin: 0 0 6px 0; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 11px; font-weight: bold; color: #5f8ec7; letter-spacing: 2px; text-transform: uppercase;">Visionaire Collection</p>
                          <!-- Product name (H3 style) -->
                          <h3 style="margin: 0 0 10px 0; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 18px; font-weight: bold; color: #1e2a35; line-height: 1.4;">Visionaire UltraLux</h3>
                          <!-- Description (15px per brand product block spec) -->
                          <p style="margin: 0 0 20px 0; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 15px; color: #1e2a35; line-height: 1.6;">UltraLux frames are built for all-day use. Lightweight construction, UV400 protection, and optical-grade clarity without the bulk.</p>
                          <!-- Primary button -->
                          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td style="border-radius: 30px; background-color: #11284f;">
                                <a href="#" style="display: inline-block; font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 30px;">Shop UltraLux</a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /600px container -->

      </td>
    </tr>
  </table>

</body>
</html>
