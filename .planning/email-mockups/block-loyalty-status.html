<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Block: Loyalty Status Bar</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f0f2f5; font-family: 'Trebuchet MS', Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f0f2f5;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Label -->
        <p style="font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #617084; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 12px 0;">Content Block: Loyalty Status Bar</p>

        <!-- 600px container -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff;">

          <!-- ========================= -->
          <!-- LOYALTY STATUS BAR BLOCK   -->
          <!-- ========================= -->
          <tr>
            <td style="padding: 0 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f7fafc; border: 1px solid rgba(17,40,79,0.12); border-radius: 6px;">
                <tr>
                  <!-- Left: tier info -->
                  <td style="padding: 16px 20px;" valign="middle" width="50%">
                    <p style="margin: 0 0 2px 0; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; color: #617084; letter-spacing: 2px; text-transform: uppercase;">VisionCare Rewards</p>
                    <p style="margin: 0; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 18px; font-weight: bold; color: #11284f; line-height: 1.3;">Gold Member</p>
                  </td>

                  <!-- Vertical divider -->
                  <td width="1" style="padding: 12px 0;">
                    <div style="width: 1px; height: 100%; min-height: 32px; background-color: rgba(17,40,79,0.12);"></div>
                  </td>

                  <!-- Right: points balance -->
                  <td style="padding: 16px 20px; text-align: right;" valign="middle" width="50%">
                    <p style="margin: 0 0 2px 0; font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; color: #617084; letter-spacing: 2px; text-transform: uppercase;">Point Balance</p>
                    <p style="margin: 0; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 18px; font-weight: bold; color: #11284f; line-height: 1.3;">2,480 pts</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /600px container -->

      </td>
    </tr>
  </table>

</body>
</html>
