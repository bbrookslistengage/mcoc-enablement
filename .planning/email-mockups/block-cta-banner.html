<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Block: CTA Banner Block</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f0f2f5; font-family: 'Trebuchet MS', Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f0f2f5;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Label -->
        <p style="font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #617084; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 12px 0;">Content Block: CTA Banner Block</p>

        <!-- 600px container -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; width: 100%; background-color: #ffffff;">

          <!-- ===================== -->
          <!-- CTA BANNER BLOCK      -->
          <!-- Compact, navy bg      -->
          <!-- ===================== -->
          <tr>
            <td style="background-color: #11284f; padding: 32px 24px; text-align: center;">
              <!-- Eyebrow -->
              <p style="margin: 0 0 8px 0; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #5f8ec7; letter-spacing: 2px; text-transform: uppercase;">One More Thing</p>
              <!-- Headline -->
              <h2 style="margin: 0 0 8px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: bold; color: #ffffff; line-height: 1.3;">Your next eye exam is on us.</h2>
              <!-- Supporting copy -->
              <p style="margin: 0 auto 24px auto; font-family: 'Trebuchet MS', Arial, sans-serif; font-size: 15px; color: rgba(255,255,255,0.80); line-height: 1.5; max-width: 420px;">Gold and Platinum members get a complimentary annual exam. Check your eligibility below.</p>
              <!-- Inverted button (white fill, navy text) -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  <td style="border-radius: 30px; background-color: #ffffff;">
                    <a href="#" style="display: inline-block; font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; color: #11284f; text-decoration: none; padding: 14px 28px; border-radius: 30px;">Book Your Exam</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /600px container -->

      </td>
    </tr>
  </table>

</body>
</html>
